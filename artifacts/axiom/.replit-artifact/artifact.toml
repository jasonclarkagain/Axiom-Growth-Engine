kind = "web"
previewPath = "/"
title = "Axiom Digital Core"
version = "1.0.0"
id = "artifacts/axiom"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19461

[services.development]
run = "pnpm --filter @workspace/axiom run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/axiom", "run", "build" ]
publicDir = "artifacts/axiom/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19461"
BASE_PATH = "/"
